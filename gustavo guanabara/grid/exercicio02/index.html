<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      div.container {
        display: grid;
        grid-template: repeat(3, 100px) / repeat(3, 1fr); /* rows depois columns */
        gap: 10px; /* espaço entre os itens */

        place-items: center center; /* align-items e justify-items */
        place-content: center center; /* align-content e justify-content */
      }

      div.item {
        border: 1px solid black;
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
      <div class="item">G</div>
      <div class="item">H</div>
      <div class="item">I</div>
    </div>
  </body>
</html>
